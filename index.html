<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>고1 문학 낙하 게임 - 사미인곡 · 오발탄 · 유충렬전</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-light: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --c1: #ec4899; /* 사미인곡 */
      --c2: #f59e0b; /* 오발탄 */
      --c3: #10b981; /* 유충렬전 */
      --danger: #ef4444;
      --gold: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      user-select: none;
    }
    .app {
      width: 100%;
      max-width: 720px;
      background: var(--panel);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .screen { display: none; padding: 24px; }
    .screen.active { display: block; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      transition: transform 0.1s, opacity 0.2s, background 0.2s;
    }
    button:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: #fff;
      padding: 14px 24px;
      font-size: 1.05rem;
      width: 100%;
    }
    .btn-secondary {
      background: var(--panel-light);
      color: var(--text);
      padding: 10px 16px;
      font-size: 0.9rem;
    }

    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 10px;
    }
    h1 { font-size: 1.7rem; line-height: 1.3; margin-bottom: 8px; }
    .subtitle { color: var(--muted); font-size: 0.95rem; margin-bottom: 20px; line-height: 1.5; }
    .rules {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      line-height: 1.65;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .rules strong { color: var(--gold); }

    .input-group { margin-bottom: 18px; }
    .input-group label { display: block; font-size: 0.9rem; font-weight: 700; margin-bottom: 6px; color: #e2e8f0; }
    input[type="text"], textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 2px solid var(--panel-light);
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    input[type="text"]:focus, textarea:focus { border-color: var(--accent); }

    .speed-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
    .speed-btn {
      background: #0f172a;
      color: var(--muted);
      padding: 12px 8px;
      border: 2px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.9rem;
    }
    .speed-btn span { font-size: 0.75rem; font-weight: 400; }
    .speed-btn.selected {
      border-color: var(--accent);
      color: #fff;
      background: rgba(56, 189, 248, 0.12);
    }

    .top-actions { display: flex; gap: 8px; margin-top: 12px; }
    .top-actions button { flex: 1; }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 12px;
    }
    .hud-left { display: flex; align-items: center; gap: 8px; }
    .player-tag { background: #0f172a; padding: 4px 10px; border-radius: 8px; font-size: 0.85rem; color: var(--accent); font-weight: 700; }
    .stage-tag { background: rgba(251, 191, 36, 0.15); color: var(--gold); padding: 4px 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 700; }
    .hud-right { display: flex; align-items: center; gap: 12px; font-weight: 700; }
    .hearts { letter-spacing: 2px; font-size: 1rem; }
    .score-box { font-size: 1.1rem; color: var(--gold); }
    .combo-badge {
      background: #ef4444;
      color: #fff;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.8rem;
      display: none;
    }

    .arena {
      position: relative;
      height: 360px;
      background: radial-gradient(circle at top, #1e293b 0%, #090d16 100%);
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #334155;
      margin-bottom: 14px;
    }
    .danger-line {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3));
    }
    .falling-card {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 88%;
      max-width: 480px;
      background: #ffffff;
      color: #0f172a;
      padding: 16px 20px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.45);
      text-align: center;
      font-weight: 800;
      font-size: 1.05rem;
      line-height: 1.45;
      border-bottom: 5px solid #cbd5e1;
      word-break: keep-all;
    }
    .card-num {
      display: block;
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 4px;
      font-weight: 700;
    }
    .feedback-toast {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 12px 22px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 1.1rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      text-align: center;
      z-index: 10;
      width: 85%;
    }
    .feedback-toast.show { opacity: 1; }
    .feedback-toast.ok { background: rgba(16, 185, 129, 0.95); color: #fff; }
    .feedback-toast.no { background: rgba(239, 68, 68, 0.95); color: #fff; }

    .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .ans-btn {
      padding: 16px 8px;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 1.05rem;
      box-shadow: 0 4px 0 rgba(0,0,0,0.3);
    }
    .ans-btn small { font-size: 0.75rem; opacity: 0.9; font-weight: 500; }
    .ans-btn[data-work="사미인곡"] { background: var(--c1); }
    .ans-btn[data-work="오발탄"] { background: var(--c2); color: #0f172a; }
    .ans-btn[data-work="유충렬전"] { background: var(--c3); color: #0f172a; }
    .key-hint { text-align: center; font-size: 0.8rem; color: var(--muted); margin-top: 10px; }

    .result-card {
      background: #0f172a;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 16px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .stamp {
      display: inline-block;
      padding: 6px 16px;
      border: 3px solid var(--gold);
      color: var(--gold);
      border-radius: 10px;
      font-weight: 900;
      font-size: 1.1rem;
      transform: rotate(-3deg);
      margin-bottom: 10px;
    }
    .final-score { font-size: 2.4rem; font-weight: 900; color: #fff; margin: 6px 0; }
    .stats-row { display: flex; justify-content: center; gap: 16px; color: var(--muted); font-size: 0.9rem; margin-top: 8px; }

    .missed-box {
      background: rgba(15, 23, 42, 0.7);
      border-radius: 14px;
      padding: 16px;
      margin-top: 16px;
      max-height: 240px;
      overflow-y: auto;
    }
    .missed-box h3 { font-size: 0.95rem; margin-bottom: 10px; color: #fda4af; }
    .missed-item {
      background: var(--panel);
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 0.85rem;
      line-height: 1.45;
    }
    .missed-item .ans-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.75rem;
      margin-right: 6px;
      background: var(--accent);
      color: #0f172a;
    }

    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.9rem; }
    th, td { padding: 10px 8px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.08); }
    th { color: var(--muted); font-size: 0.8rem; }
    tr.rank-1 { background: rgba(251, 191, 36, 0.15); font-weight: 800; color: var(--gold); }
    tr.rank-2 { background: rgba(148, 163, 184, 0.12); font-weight: 700; }
    tr.rank-3 { background: rgba(180, 83, 9, 0.15); font-weight: 700; }
    .tab-bar { display: flex; gap: 6px; margin-bottom: 14px; }
    .tab-btn { flex: 1; padding: 10px; background: #0f172a; color: var(--muted); font-size: 0.85rem; }
    .tab-btn.active { background: var(--accent); color: #0f172a; }
    .teacher-panel { background: #0f172a; padding: 14px; border-radius: 12px; margin-top: 12px; font-size: 0.85rem; line-height: 1.5; }
  </style>
</head>
<body>
<div class="app">

  <!-- 1. 시작 화면 -->
  <div id="startScreen" class="screen active">
    <span class="badge">고1 국어 문학 집중 훈련 · 총 30문항</span>
    <h1>📚 한국 문학 낙하 게임</h1>
    <p class="subtitle">하늘에서 떨어지는 핵심 구절과 설명을 보고 <strong>사미인곡 · 오발탄 · 유충렬전</strong> 중 알맞은 작품으로 받아내세요!</p>

    <div class="rules">
      ① 카드가 바닥에 닿기 전에 <strong>사미인곡 · 오발탄 · 유충렬전</strong> 버튼을 누르세요.<br/>
      ② 정답 <strong>100점</strong> + 빠를수록 <strong>스피드 보너스(최대 50점)</strong> + <strong>콤보 보너스</strong>!<br/>
      ③ 틀리거나 놓치면 <strong>❤가 1개 감소</strong>합니다. (총 8개)<br/>
      ④ <strong>1단계(기초) → 2단계(심화) → 3단계(문학사·표현)</strong> 총 30문제! 동점 시 <strong>클리어 시간이 빠른 학생</strong>이 상위 등수가 됩니다.
    </div>

    <div class="input-group">
      <label for="studentName">학생 이름 (학번+이름 권장, 예: 10315 홍길동)</label>
